<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DIL BINGO Pro</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0f172a;
            color: #ffffff;
            text-align: center;
            padding: 6px;
            margin: 0;
            padding-bottom: 75px;
        }
        .wallet-container {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 6px;
        }
        .wallet-box {
            background: #1e293b;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: bold;
            color: #38bdf8;
            border: 1px solid #334155;
        }
        .timer-box {
            background: #3b82f6;
            color: white;
            padding: 6px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: bold;
            margin-bottom: 6px;
            max-width: 340px;
            margin-left: auto;
            margin-right: auto;
        }
        .selectors-wrapper {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 6px;
            flex-wrap: wrap;
        }
        .card-selector select {
            padding: 4px 8px;
            background: #1e293b;
            color: white;
            border: 1px solid #475569;
            border-radius: 6px;
            font-size: 12px;
        }
        .number-board {
            font-size: 13px;
            font-weight: bold;
            color: #facc15;
            background: #1e293b;
            padding: 6px;
            border-radius: 8px;
            margin-bottom: 6px;
            border: 1px solid #334155;
            max-width: 340px;
            margin-left: auto;
            margin-right: auto;
        }
        .cards-container {
            display: flex;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 8px;
        }
        .card-wrapper {
            background: #1e293b;
            padding: 6px;
            border-radius: 8px;
            border: 1px solid #475569;
        }
        .card-title {
            font-size: 12px;
            color: #38bdf8;
            margin-bottom: 4px;
            font-weight: bold;
        }
        .bingo-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 3px;
            width: 150px;
        }
        .cell {
            background: #334155;
            border: 1px solid #475569;
            aspect-ratio: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
        }
        .cell.marked {
            background: #0284c7;
            color: white;
            border-color: #38bdf8;
        }
        .cell.star {
            background: #f59e0b;
            color: #000;
        }
        .btn-container {
            display: flex;
            gap: 8px;
            justify-content: center;
            margin-bottom: 10px;
        }
        .btn {
            padding: 8px 20px;
            font-size: 13px;
            font-weight: bold;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }
        .btn-leave { background: #ef4444; color: white; }
        .btn-bingo { background: #22c55e; color: white; }
        .nav-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: #1e293b;
            display: flex;
            justify-content: space-around;
            padding: 8px 0;
            border-top: 2px solid #334155;
            z-index: 1000;
        }
        .nav-item {
            font-size: 11px;
            text-align: center;
            color: #94a3b8;
            cursor: pointer;
        }
        .nav-item.active { color: #38bdf8; }
        .nav-icon { font-size: 16px; display: block; margin-bottom: 2px; }
    </style>
</head>
<body>

    <div class="wallet-container">
        <div class="wallet-box" id="main-wallet">Main: 0 ETB</div>
        <div class="wallet-box" id="play-wallet">Play: 10 ETB</div>
    </div>

    <div class="timer-box" id="timer-display">
        ⏳ ጨዋታው ሊጀመር ነው... (39 ሰ)
    </div>

    <div class="selectors-wrapper">
        <div class="card-selector">
            <label for="card-select"><b>ካርቴላ:</b></label>
            <select id="card-select" onchange="changeCard()">
                <option value="">ካርቴላ ይምረጡ</option>
            </select>
        </div>
    </div>

    <div class="number-board" id="called-display">
        🎲 የሚወጣው ቁጥር: በመጠባበቅ ላይ...
    </div>

    <div class="cards-container" id="cards-container"></div>

    <div class="btn-container">
        <button class="btn btn-leave" onclick="leaveGame()">Leave</button>
        <button class="btn btn-bingo" onclick="checkBingo()">BINGO!</button>
    </div>

    <div class="nav-bar">
        <div class="nav-item active"><span class="nav-icon">🎮</span>Game</div>
        <div class="nav-item"><span class="nav-icon">📊</span>Scores</div>
        <div class="nav-item"><span class="nav-icon">📜</span>History</div>
        <div class="nav-item"><span class="nav-icon">💰</span>Wallet</div>
        <div class="nav-item"><span class="nav-icon">👤</span>Profile</div>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();

        let mainWallet = parseFloat(localStorage.getItem('dil_main_wallet')) || 0;
        let playWallet = parseFloat(localStorage.getItem('dil_play_wallet')) || 10;
        let stake = 10;

        function updateWallets() {
            document.getElementById('main-wallet').innerText = `Main: ${mainWallet} ETB`;
            document.getElementById('play-wallet').innerText = `Play: ${playWallet} ETB`;
            localStorage.setItem('dil_main_wallet', mainWallet);
            localStorage.setItem('dil_play_wallet', playWallet);
        }
        updateWallets();

        const selectCard = document.getElementById('card-select');
        for (let i = 1; i <= 250; i++) {
            let opt = document.createElement('option');
            opt.value = i;
            opt.innerText = `ካርቴላ #${i}`;
            selectCard.appendChild(opt);
        }

        let selectedCard = localStorage.getItem('dil_selected_card') || "195";
        selectCard.value = selectedCard;

        function getCardNumbers(seed) {
            let cols = [
                Array.from({length: 15}, (_, i) => i + 1),
                Array.from({length: 15}, (_, i) => i + 16),
                Array.from({length: 15}, (_, i) => i + 31),
                Array.from({length: 15}, (_, i) => i + 46),
                Array.from({length: 15}, (_, i) => i + 61)
            ];
            
            let cardCols = [];
            let randomSeed = parseInt(seed) * 997;

            for (let c = 0; c < 5; c++) {
                let shuffled = [...cols[c]];
                for (let i = shuffled.length - 1; i > 0; i--) {
                    randomSeed = (randomSeed * 9301 + 49297) % 233280;
                    let j = Math.floor((randomSeed / 233280) * (i + 1));
                    [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
                }
                cardCols.push(shuffled.slice(0, 5));
            }

            let cardGrid = [];
            for (let r = 0; r < 5; r++) {
                for (let c = 0; c < 5; c++) {
                    if (r === 2 && c === 2) {
                        cardGrid.push('⭐');
                    } else {
                        cardGrid.push(cardCols[c][r]);
                    }
                }
            }
            return cardGrid;
        }

        function renderUserCard() {
            const container = document.getElementById('cards-container');
            container.innerHTML = '';

            let wrapper = document.createElement('div');
            wrapper.className = 'card-wrapper';

            let title = document.createElement('div');
            title.className = 'card-title';
            title.innerText = selectedCard ? `Cartela No : ${selectedCard}` : `ካርቴላ አልተመረጠም`;
            wrapper.appendChild(title);

            let grid = document.createElement('div');
            grid.className = 'bingo-grid';

            if (!selectedCard) {
                for (let i = 0; i < 25; i++) {
                    let cell = document.createElement('div');
                    cell.className = 'cell';
                    grid.appendChild(cell);
                }
            } else {
                let cardItems = getCardNumbers(selectedCard);
                let savedMarks = JSON.parse(localStorage.getItem(`dil_marks_${selectedCard}`)) || {};

                for (let i = 0; i < 25; i++) {
                    let cell = document.createElement('div');
                    cell.className = 'cell';
                    let val = cardItems[i];

                    if (i === 12) {
                        cell.innerText = '⭐';
                        cell.classList.add('star', 'marked');
                    } else {
                        cell.innerText = val;
                        if (savedMarks[val]) {
                            cell.classList.add('marked');
                        }
                        
                        cell.onclick = function() {
                            let gameActive = localStorage.getItem('dil_game_active') === 'true';
                            if (!gameActive) {
                                alert('⚠️ ጨዋታው ገና አልጀመረም!');
                                return;
                            }
                            this.classList.toggle('marked');
                            savedMarks[val] = this.classList.contains('marked');
                            localStorage.setItem(`dil_marks_${selectedCard}`, JSON.stringify(savedMarks));
                        };
                    }
                    grid.appendChild(cell);
                }
            }
            wrapper.appendChild(grid);
            container.appendChild(wrapper);
        }

        function changeCard() {
            let gameActive = localStorage.getItem('dil_game_active') === 'true';
            if (gameActive) {
                alert('⚠️ ጨዋታው በመካሄድ ላይ ስለሆነ ካርቴላ መቀየር አይቻልም!');
                return;
            }
            selectedCard = selectCard.value;
            localStorage.setItem('dil_selected_card', selectedCard);
            renderUserCard();
        }

        let timeLeft = parseInt(localStorage.getItem('dil_timer')) || 39;
        let gameActive = localStorage.getItem('dil_game_active') === 'true';

        if (gameActive) {
            document.getElementById('timer-display').innerText = '🚀 ጨዋታው እየተካሄደ ነው!';
            selectCard.disabled = true;
            startCaller();
        } else {
            let timerInterval = setInterval(() => {
                if (timeLeft > 0) {
                    timeLeft--;
                    document.getElementById('timer-display').innerText = `⏳ ጨዋታው ሊጀመር ነው... (${timeLeft} ሰ)`;
                    localStorage.setItem('dil_timer', timeLeft);
                } else {
                    clearInterval(timerInterval);
                    localStorage.setItem('dil_game_active', 'true');
                    document.getElementById('timer-display').innerText = `🚀 ጨዋታው ጀምሯል!`;
                    selectCard.disabled = true;
                    startCaller();
                }
            }, 1000);
        }

        let calledNumbersList = JSON.parse(localStorage.getItem('dil_called_numbers')) || [];

        function startCaller() {
            let allNums = JSON.parse(localStorage.getItem('dil_remaining_nums'));
            if (!allNums || allNums.length === 0) {
                allNums = Array.from({length: 75}, (_, i) => i + 1);
                allNums.sort(() => Math.random() - 0.5);
            }

            let callerInterval = setInterval(() => {
                if(allNums.length === 0) {
                    clearInterval(callerInterval);
                    return;
                }
                let currentNum = allNums.pop();
                calledNumbersList.push(currentNum);
                
                document.getElementById('called-display').innerText = `🎲 የሚወጣው ቁጥር: ${currentNum}`;
                
                if (selectedCard) {
                    let cardItems = getCardNumbers(selectedCard);
                    if (cardItems.includes(currentNum)) {
                        let savedMarks = JSON.parse(localStorage.getItem(`dil_marks_${selectedCard}`)) || {};
                        savedMarks[currentNum] = true;
                        localStorage.setItem(`dil_marks_${selectedCard}`, JSON.stringify(savedMarks));
                        renderUserCard();
                    }
                }

                localStorage.setItem('dil_remaining_nums', JSON.stringify(allNums));
                localStorage.setItem('dil_called_numbers', JSON.stringify(calledNumbersList));
            }, 3000);
        }

        function checkBingo() {
            let gameActive = localStorage.getItem('dil_game_active') === 'true';
            if (!gameActive) {
                alert('⚠️ ጨዋታው ገና አልጀመረም!');
                return;
            }

            if (!selectedCard) {
                alert('⚠️ እባክዎ መጀመሪያ ካርቴላ ይምረጡ!');
                return;
            }

            let cardItems = getCardNumbers(selectedCard);
            let savedMarks = JSON.parse(localStorage.getItem(`dil_marks_${selectedCard}`)) || {};
            
            let gridMatrix = [];
            for (let r = 0; r < 5; r++) {
                let row = [];
                for (let c = 0; c < 5; c++) {
                    let idx = r * 5 + c;
                    let val = cardItems[idx];
                    let isMarked = (idx === 12) || savedMarks[val];
                    row.push(isMarked);
                }
                gridMatrix.push(row);
            }

            let hasWon = false;
            for (let i = 0; i < 5; i++) {
                if (gridMatrix[i].every(val => val)) hasWon = true;
                if (gridMatrix.every(row => row[i])) hasWon = true;
            }
            if ([0,1,2,3,4].every(i => gridMatrix[i][i])) hasWon = true;
            if ([0,1,2,3,4].every(i => gridMatrix[i][4 - i])) hasWon = true;

            if (hasWon) {
                mainWallet += 100;
                updateWallets();
                alert('🎉 እንኳን ደስ አለዎት! ቢንጎዎ ተረጋግጧል! 100 ETB ወደ ዋናው አካውንትዎ ገብቷል!');
            } else {
                alert('❌ እስካሁን ሙሉ መስመር (Bingo Line) አልሞላም!');
            }
        }

        function leaveGame() {
            localStorage.clear();
            window.location.reload();
        }

        renderUserCard();
    </script>
</body>
</html>
