<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yohans Bingo Pro</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0f172a;
            color: #ffffff;
            text-align: center;
            padding: 6px;
            margin: 0;
            padding-bottom: 75px;
        }
        .wallet-box {
            background: #064e3b;
            padding: 6px;
            border-radius: 6px;
            margin-bottom: 6px;
            font-size: 13px;
            font-weight: bold;
            color: #34d399;
            border: 1px solid #047857;
            max-width: 340px;
            margin-left: auto;
            margin-right: auto;
        }
        .timer-box {
            background: #b45309;
            color: white;
            padding: 8px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: bold;
            margin-bottom: 6px;
            max-width: 340px;
            margin-left: auto;
            margin-right: auto;
        }
        .auto-mark-box {
            background: #1e293b;
            padding: 6px 12px;
            border-radius: 8px;
            margin-bottom: 6px;
            font-size: 12px;
            display: inline-block;
            border: 1px solid #334155;
        }
        .selectors-wrapper {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 6px;
            flex-wrap: wrap;
        }
        .card-selector {
            font-size: 12px;
        }
        .card-selector select {
            padding: 4px 8px;
            background: #1e293b;
            color: white;
            border: 1px solid #475569;
            border-radius: 6px;
            font-size: 12px;
        }
        .master-board {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 3px;
            max-width: 340px;
            margin: 0 auto 6px auto;
            background: #1e293b;
            padding: 6px;
            border-radius: 8px;
            border: 1px solid #334155;
        }
        .master-col {
            display: flex;
            flex-direction: column;
            gap: 3px;
        }
        .master-header {
            background: #0ea5e9;
            color: #000;
            font-weight: bold;
            font-size: 14px;
            padding: 5px 0;
            border-radius: 4px;
        }
        .master-cell {
            background: #1e293b;
            color: #64748b;
            font-size: 12px;
            font-weight: bold;
            padding: 5px 0;
            border-radius: 3px;
        }
        .master-cell.called {
            background: #f59e0b;
            color: #000;
        }
        .number-board {
            font-size: 14px;
            font-weight: bold;
            color: #facc15;
            background: #1e293b;
            padding: 6px;
            border-radius: 8px;
            margin-bottom: 6px;
            border: 1px solid #334155;
            max-width: 340px;
            margin-left: auto;
            margin-right: auto;
        }
        .cards-container {
            display: flex;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 8px;
        }
        .card-wrapper {
            background: #1e293b;
            padding: 6px;
            border-radius: 8px;
            border: 1px solid #475569;
        }
        .card-title {
            font-size: 12px;
            color: #38bdf8;
            margin-bottom: 4px;
            font-weight: bold;
        }
        .bingo-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 3px;
            width: 150px;
        }
        .cell {
            background: #334155;
            border: 1px solid #475569;
            aspect-ratio: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
        }
        .cell.marked {
            background: #0284c7;
            color: white;
            border-color: #38bdf8;
        }
        .cell.star {
            background: #f59e0b;
            color: #000;
        }
        .winners-history {
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid #334155;
            border-radius: 6px;
            padding: 5px;
            max-width: 320px;
            margin: 0 auto 8px auto;
            font-size: 11px;
            text-align: left;
        }
        .winners-history h4 { margin: 0 0 3px 0; color: #38bdf8; font-size: 12px; text-align: center; }
        .winners-list { list-style: none; padding: 0; margin: 0; max-height: 45px; overflow-y: auto; }
        .winners-list li { padding: 2px 0; border-bottom: 1px solid #1e293b; display: flex; justify-content: space-between; }
        .btn-container {
            display: flex;
            gap: 8px;
            justify-content: center;
            margin-bottom: 10px;
        }
        .btn {
            padding: 8px 20px;
            font-size: 13px;
            font-weight: bold;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }
        .btn-leave { background: #ef4444; color: white; }
        .btn-bingo { background: #22c55e; color: white; }
        .nav-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: #1e293b;
            display: flex;
            justify-content: space-around;
            padding: 8px 0;
            border-top: 2px solid #334155;
            z-index: 1000;
        }
        .nav-item {
            font-size: 11px;
            text-align: center;
            color: #94a3b8;
            cursor: pointer;
        }
        .nav-item.active { color: #38bdf8; }
        .nav-icon { font-size: 16px; display: block; margin-bottom: 2px; }
    </style>
</head>
<body>

    <div class="wallet-box" id="wallet-display">
        🏆 የድርሻዎ: 0.00 ETB
    </div>

    <div class="timer-box" id="timer-display">
        ⏳ ጨዋታው ሊጀመር ነው... (45 ሰ)
    </div>

    <div class="auto-mark-box">
        <label>
            <input type="checkbox" id="auto-mark-toggle" checked onchange="toggleAutoMark()"> 🤖 አውቶማቲክ ማርክ (Auto-Mark)
        </label>
    </div>

    <div class="selectors-wrapper">
        <div class="card-selector">
            <label for="card-select-1"><b>ካርቴላ 1:</b></label>
            <select id="card-select-1" onchange="changeCard(1)"></select>
        </div>
        <div class="card-selector">
            <label for="card-select-2"><b>ካርቴላ 2:</b></label>
            <select id="card-select-2" onchange="changeCard(2)"></select>
        </div>
    </div>

    <div class="master-board" id="master-board"></div>

    <div class="number-board" id="called-display">
        🎲 የሚወጣው ቁጥር: ጨዋታው እስኪጀምር በመጠባበቅ ላይ...
    </div>

    <div class="cards-container" id="cards-container"></div>

    <div class="winners-history">
        <h4>🏆 የቅርብ ጊዜ አሸናፊዎች</h4>
        <ul class="winners-list">
            <li><span>አቤል (ካርቴላ #12)</span> <span>+320 ETB</span></li>
            <li><span>ሶፊያ (ካርቴላ #85)</span> <span>+450 ETB</span></li>
        </ul>
    </div>

    <div class="btn-container">
        <button class="btn btn-leave" onclick="leaveGame()">Leave</button>
        <button class="btn btn-bingo" onclick="checkBingo()">BINGO!</button>
    </div>

    <div class="nav-bar">
        <div class="nav-item active"><span class="nav-icon">🎮</span>Game</div>
        <div class="nav-item"><span class="nav-icon">📊</span>Scores</div>
        <div class="nav-item"><span class="nav-icon">📜</span>History</div>
        <div class="nav-item" onclick="addInviteBonus()"><span class="nav-icon">💰</span>Invite</div>
        <div class="nav-item"><span class="nav-icon">👤</span>Profile</div>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();

        let userBalance = parseFloat(localStorage.getItem('yohans_balance'));
        if (isNaN(userBalance)) {
            userBalance = 10.00;
            localStorage.setItem('yohans_balance', userBalance);
        }

        function updateWalletDisplay() {
            document.getElementById('wallet-display').innerText = `🏆 የድርሻዎ: ${userBalance.toFixed(2)} ETB`;
        }
        updateWalletDisplay();

        function addInviteBonus() {
            userBalance += 10.00;
            localStorage.setItem('yohans_balance', userBalance);
            updateWalletDisplay();
            alert('✅ ጓደኛ በመጋበዝዎ 10 ETB ቦነስ አግኝተዋል!');
        }

        function playSound(type) {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.connect(gain);
                gain.connect(ctx.destination);
                if (type === 'mark') {
                    osc.frequency.setValueAtTime(600, ctx.currentTime);
                    gain.gain.setValueAtTime(0.1, ctx.currentTime);
                    osc.start(); osc.stop(ctx.currentTime + 0.08);
                } else if (type === 'call') {
                    osc.frequency.setValueAtTime(400, ctx.currentTime);
                    gain.gain.setValueAtTime(0.15, ctx.currentTime);
                    osc.start(); osc.stop(ctx.currentTime + 0.12);
                } else if (type === 'bingo') {
                    osc.frequency.setValueAtTime(800, ctx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(1200, ctx.currentTime + 0.3);
                    gain.gain.setValueAtTime(0.2, ctx.currentTime);
                    osc.start(); osc.stop(ctx.currentTime + 0.4);
                }
            } catch (e) {}
        }

        const select1 = document.getElementById('card-select-1');
        const select2 = document.getElementById('card-select-2');

        let defaultOpt1 = document.createElement('option');
        defaultOpt1.value = ""; defaultOpt1.innerText = "ካርቴላ ይምረጡ";
        select1.appendChild(defaultOpt1);

        let defaultOpt2 = document.createElement('option');
        defaultOpt2.value = ""; defaultOpt2.innerText = "ካርቴላ ይምረጡ";
        select2.appendChild(defaultOpt2);

        for (let i = 1; i <= 200; i++) {
            let opt1 = document.createElement('option');
            opt1.value = i; opt1.innerText = `ካርቴላ #${i}`;
            select1.appendChild(opt1);

            let opt2 = document.createElement('option');
            opt2.value = i; opt2.innerText = `ካርቴላ #${i}`;
            select2.appendChild(opt2);
        }

        let savedCard1 = localStorage.getItem('yohans_selected_card_1') || "";
        let savedCard2 = localStorage.getItem('yohans_selected_card_2'] || "";
        select1.value = savedCard1;
        select2.value = savedCard2;

        let autoMark = localStorage.getItem('yohans_automark') === 'true';
        document.getElementById('auto-mark-toggle').checked = autoMark;

        function toggleAutoMark() {
            autoMark = document.getElementById('auto-mark-toggle').checked;
            localStorage.setItem('yohans_automark', autoMark);
        }

        const bingoCols = {
            'B': Array.from({length: 15}, (_, i) => i + 1),
            'I': Array.from({length: 15}, (_, i) => i + 16),
            'N': Array.from({length: 15}, (_, i) => i + 31),
            'G': Array.from({length: 15}, (_, i) => i + 46),
            'O': Array.from({length: 15}, (_, i) => i + 61)
        };

        function renderMasterBoard(calledList) {
            const masterBoard = document.getElementById('master-board');
            masterBoard.innerHTML = '';
            for (let [letter, nums] of Object.entries(bingoCols)) {
                let colDiv = document.createElement('div');
                colDiv.className = 'master-col';
                let headerDiv = document.createElement('div');
                headerDiv.className = 'master-header';
                headerDiv.innerText = letter;
                colDiv.appendChild(headerDiv);

                nums.forEach(num => {
                    let cellDiv = document.createElement('div');
                    cellDiv.className = 'master-cell';
                    cellDiv.innerText = num;
                    if (calledList.includes(num)) {
                        cellDiv.classList.add('called');
                    }
                    colDiv.appendChild(cellDiv);
                });
                masterBoard.appendChild(colDiv);
            }
        }

        renderMasterBoard([]);

        // ቁጥሮች በፍፁም እንዳይደጋገሙ የሚያደርግ ትክክለኛ የካርቴላ አወጣጥ ስልተ-ቀመር
        function getCardNumbers(seed) {
            let cols = [
                Array.from({length: 15}, (_, i) => i + 1),
                Array.from({length: 15}, (_, i) => i + 16),
                Array.from({length: 15}, (_, i) => i + 31),
                Array.from({length: 15}, (_, i) => i + 46),
                Array.from({length: 15}, (_, i) => i + 61)
            ];
            
            let cardCols = [];
            let randomSeed = parseInt(seed) * 997;

            for (let c = 0; c < 5; c++) {
                let shuffled = [...cols[c]];
                for (let i = shuffled.length - 1; i > 0; i--) {
                    randomSeed = (randomSeed * 9301 + 49297) % 233280;
                    let j = Math.floor((randomSeed / 233280) * (i + 1));
                    [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
                }
                cardCols.push(shuffled.slice(0, 5));
            }

            let cardGrid = [];
            for (let r = 0; r < 5; r++) {
                for (let c = 0; c < 5; c++) {
                    if (r === 2 && c === 2) {
                        cardGrid.push('⭐');
                    } else {
                        cardGrid.push(cardCols[c][r]);
                    }
                }
            }
            return cardGrid;
        }

        function renderUserCards() {
            const container = document.getElementById('cards-container');
            container.innerHTML = '';

            [ {cardNum: savedCard1, index: 1}, {cardNum: savedCard2, index: 2} ].forEach(item => {
                let wrapper = document.createElement('div');
                wrapper.className = 'card-wrapper';

                let title = document.createElement('div');
                title.className = 'card-title';
                title.innerText = item.cardNum ? `ካርቴላ #${item.cardNum}` : `ካርቴላ አልተመረጠም`;
                wrapper.appendChild(title);

                let grid = document.createElement('div');
                grid.className = 'bingo-grid';

                if (!item.cardNum || item.cardNum === "") {
                    for (let i = 0; i < 25; i++) {
                        let cell = document.createElement('div');
                        cell.className = 'cell';
                        grid.appendChild(cell);
                    }
                } else {
                    let cardItems = getCardNumbers(item.cardNum);
                    let savedMarks = JSON.parse(localStorage.getItem(`yohans_marks_${item.index}_${item.cardNum}`)) || {};

                    for (let i = 0; i < 25; i++) {
                        let cell = document.createElement('div');
                        cell.className = 'cell';
                        let val = cardItems[i];

                        if (i === 12) {
                            cell.innerText = '⭐';
                            cell.classList.add('star', 'marked');
                        } else {
                            cell.innerText = val;
                            if (savedMarks[val]) {
                                cell.classList.add('marked');
                            }
                            
                            cell.onclick = function() {
                                let gameActive = localStorage.getItem('yohans_game_active') === 'true';
                                if (!gameActive) {
                                    alert('⚠️ ጨዋታው ገና አልጀመረም!');
                                    return;
                                }
                                this.classList.toggle('marked');
                                playSound('mark');
                                savedMarks[val] = this.classList.contains('marked');
                                localStorage.setItem(`yohans_marks_${item.index}_${item.cardNum}`, JSON.stringify(savedMarks));
                            };
                        }
                        grid.appendChild(cell);
                    }
                }
                wrapper.appendChild(grid);
                container.appendChild(wrapper);
            });
        }

        function changeCard(cardIndex) {
            let gameActive = localStorage.getItem('yohans_game_active') === 'true';
            if (gameActive) {
                alert('⚠️ ጨዋታው በመካሄድ ላይ ስለሆነ ካርቴላ መቀየር አይቻልም!');
                return;
            }
            if (cardIndex === 1) {
                savedCard1 = select1.value;
                localStorage.setItem('yohans_selected_card_1', savedCard1);
            } else {
                savedCard2 = select2.value;
                localStorage.setItem('yohans_selected_card_2', savedCard2);
            }
            renderUserCards();
        }

        let timeLeft = parseInt(localStorage.getItem('yohans_timer')) || 45;
        let gameActive = localStorage.getItem('yohans_game_active') === 'true';

        if (gameActive) {
            document.getElementById('timer-display').innerText = '🚀 ጨዋታው እየተካሄደ ነው!';
            select1.disabled = true;
            select2.disabled = true;
            startCaller();
        } else {
            let timerInterval = setInterval(() => {
                if (timeLeft > 0) {
                    timeLeft--;
                    document.getElementById('timer-display').innerText = `⏳ ጨዋታው ሊጀመር ነው... (${timeLeft} ሰ)`;
                    localStorage.setItem('yohans_timer', timeLeft);
                } else {
                    clearInterval(timerInterval);
                    localStorage.setItem('yohans_game_active', 'true');
                    document.getElementById('timer-display').innerText = `🚀 ጨዋታው ጀምሯል!`;
                    select1.disabled = true;
                    select2.disabled = true;
                    startCaller();
                }
            }, 1000);
        }

        let calledNumbersList = JSON.parse(localStorage.getItem('yohans_called_numbers')) || [];

        function startCaller() {
            let allNums = JSON.parse(localStorage.getItem('yohans_remaining_nums'));
            if (!allNums || allNums.length === 0) {
                allNums = Array.from({length: 75}, (_, i) => i + 1);
                allNums.sort(() => Math.random() - 0.5);
            }

            let callerInterval = setInterval(() => {
                if(allNums.length === 0) {
                    clearInterval(callerInterval);
                    return;
                }
                let currentNum = allNums.pop();
                calledNumbersList.push(currentNum);
                
                document.getElementById('called-display').innerText = `🎲 የሚወጣው ቁጥር: ${currentNum}`;
                playSound('call');
                
                renderMasterBoard(calledNumbersList);

                if (autoMark) {
                    [ {cardNum: savedCard1, index: 1}, {cardNum: savedCard2, index: 2} ].forEach(item => {
                        if (item.cardNum) {
                            let cardItems = getCardNumbers(item.cardNum);
                            if (cardItems.includes(currentNum)) {
                                let savedMarks = JSON.parse(localStorage.getItem(`yohans_marks_${item.index}_${item.cardNum}`)) || {};
                                savedMarks[currentNum] = true;
                                localStorage.setItem(`yohans_marks_${item.index}_${item.cardNum}`, JSON.stringify(savedMarks));
                            }
                        }
                    });
                    renderUserCards();
                }

                localStorage.setItem('yohans_remaining_nums', JSON.stringify(allNums));
                localStorage.setItem('yohans_called_numbers', JSON.stringify(calledNumbersList));
            }, 3000);
        }

        // የቢንጎ ማረጋገጫ (Validation Logic) - መስመር መሟላቱን ማረጋገጥ
        function checkBingo() {
            let gameActive = localStorage.getItem('yohans_game_active') === 'true';
            if (!gameActive) {
                alert('⚠️ ጨዋታው ገና አልጀመረም!');
                return;
            }

            let hasWon = false;
            [ {cardNum: savedCard1, index: 1}, {cardNum: savedCard2, index: 2} ].forEach(item => {
                if (item.cardNum) {
                    let cardItems = getCardNumbers(item.cardNum);
                    let savedMarks = JSON.parse(localStorage.getItem(`yohans_marks_${item.index}_${item.cardNum}`)) || {};
                    
                    let gridMatrix = [];
                    for (let r = 0; r < 5; r++) {
                        let row = [];
                        for (let c = 0; c < 5; c++) {
                            let idx = r * 5 + c;
                            let val = cardItems[idx];
                            let isMarked = (idx === 12) || savedMarks[val];
                            row.push(isMarked);
                        }
                        gridMatrix.push(row);
                    }

                    // አግድም (Rows) ወይም ቁልቁል (Columns) መሟላታቸውን ማረጋገጥ
                    for (let i = 0; i < 5; i++) {
                        if (gridMatrix[i].every(val => val)) hasWon = true; // Row
                        if (gridMatrix.every(row => row[i])) hasWon = true; // Column
                    }
                    // ሰያፍ (Diagonals) መሟላታቸውን ማረጋገጥ
                    if ([0,1,2,3,4].every(i => gridMatrix[i][i])) hasWon = true;
                    if ([0,1,2,3,4].every(i => gridMatrix[i][4 - i])) hasWon = true;
                }
            });

            if (hasWon) {
                playSound('bingo');
                userBalance += 100.00; // የማሸነፊያ ሽልማት
                localStorage.setItem('yohans_balance', userBalance);
                updateWalletDisplay();
                alert('🎉 እንኳን ደስ አለዎት! ቢንጎዎ በትክክል ተረጋግጧል! 100 ETB አሸንፈዋል!');
            } else {
                alert('❌ እስካሁን ሙሉ መስመር (Bingo Line) አልሞላም! ተጨማሪ ቁጥሮችን ይጠብቁ።');
            }
        }

        function leaveGame() {
            localStorage.clear();
            window.location.reload();
        }

        renderUserCards();
    </script>
</body>
</html>
