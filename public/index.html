<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yohans Bingo</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #0f172a;
            color: #ffffff;
            margin: 0;
            padding: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .header {
            display: flex;
            justify-content: space-between;
            width: 100%;
            max-width: 400px;
            background: #1e293b;
            padding: 10px 15px;
            border-radius: 10px;
            margin-bottom: 10px;
            box-sizing: border-box;
        }
        .wallet-box {
            text-align: center;
        }
        .wallet-title {
            font-size: 11px;
            color: #94a3b8;
        }
        .wallet-amount {
            font-size: 15px;
            font-weight: bold;
            color: #38bdf8;
        }
        .timer-circle {
            width: 80px;
            height: 80px;
            background: #1e293b;
            border: 4px solid #f59e0b;
            border-radius: 50%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin: 10px auto;
        }
        .timer-num {
            font-size: 22px;
            font-weight: bold;
            color: #f59e0b;
        }
        .timer-text {
            font-size: 10px;
            color: #94a3b8;
        }
        .status-msg {
            background: #1e293b;
            padding: 8px;
            border-radius: 8px;
            width: 100%;
            max-width: 400px;
            text-align: center;
            font-size: 13px;
            color: #facc15;
            margin-bottom: 10px;
            box-sizing: border-box;
        }
        .cards-section {
            width: 100%;
            max-width: 400px;
            background: #1e293b;
            padding: 12px;
            border-radius: 12px;
            box-sizing: border-box;
            margin-bottom: 15px;
        }
        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
            font-size: 14px;
            font-weight: bold;
        }
        .cards-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 6px;
        }
        .card-box {
            background: #334155;
            aspect-ratio: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border-radius: 8px;
            cursor: pointer;
            border: 2px solid transparent;
            font-size: 16px;
            font-weight: bold;
        }
        .card-box.selected {
            border-color: #22c55e;
            background: #065f46;
        }
        .card-box .dots {
            font-size: 9px;
            color: #f59e0b;
            margin-top: 2px;
        }
    </style>
</head>
<body>

    <div class="header">
        <div class="wallet-box">
            <div class="wallet-title">Main Wallet</div>
            <div class="wallet-amount" id="mainWallet">0.00</div>
        </div>
        <div class="wallet-box">
            <div class="wallet-title">Play Wallet</div>
            <div class="wallet-amount" id="playWallet">0.00</div>
        </div>
        <div class="wallet-box">
            <div class="wallet-title">Stake</div>
            <div class="wallet-amount">10</div>
        </div>
    </div>

    <div class="timer-circle">
        <div class="timer-num" id="timerNum">45</div>
        <div class="timer-text">ሰአቱ ይጀምራል</div>
    </div>

    <div class="status-msg" id="statusMsg">
        ⏳ ካርቴላ በመጠበቅ ላይ...
    </div>

    <div class="cards-section">
        <div class="card-header">
            <span>ካርቴላዎች (100)</span>
            <span id="selectedCount" style="color: #38bdf8;">0/2 ተመርጧል</span>
        </div>
        <div class="cards-grid" id="cardsGrid"></div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        const user = tg.initDataUnsafe?.user;
        const telegramId = user ? user.id.toString() : '8311910460';

        let selectedCards = [];

        function fetchUserData() {
            fetch(`/api/user/${telegramId}`)
                .then(res => res.json())
                .then(data => {
                    if (data.success) {
                        document.getElementById('mainWallet').innerText = data.balance.toFixed(2);
                        document.getElementById('playWallet').innerText = data.playWallet.toFixed(2);
                    }
                });
        }

        const grid = document.getElementById('cardsGrid');
        for (let i = 1; i <= 100; i++) {
            let card = document.createElement('div');
            card.className = 'card-box';
            card.innerHTML = `<span>${i}</span><span class="dots">•••••</span>`;
            card.onclick = () => toggleCard(i, card);
            grid.appendChild(card);
        }

        function toggleCard(cardNum, element) {
            if (selectedCards.includes(cardNum)) {
                selectedCards = selectedCards.filter(id => id !== cardNum);
                element.classList.remove('selected');
            } else {
                if (selectedCards.length >= 2) {
                    alert('⚠️ እስከ 2 ካርቴላ ብቻ መምረጥ ይቻላል!');
                    return;
                }
                selectedCards.push(cardNum);
                element.classList.add('selected');
            }
            document.getElementById('selectedCount').innerText = `${selectedCards.length}/2 ተመርጧል`;

            fetch('/api/select-cards', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ telegramId, selectedCards })
            });
        }

        const socket = io();
        socket.on('init_state', (data) => {
            document.getElementById('timerNum').innerText = data.gameTimer;
        });
        socket.on('timer_update', (data) => {
            document.getElementById('timerNum').innerText = data.timer;
            if (data.waitingForPlayers) {
                document.getElementById('statusMsg').innerText = "⏳ ካርቴላ በመጠበቅ ላይ... (ማንም ካርቴላ አልያዘም)";
            } else {
                document.getElementById('statusMsg').innerText = "🎮 ጨዋታው ሊጀምር ነው!";
            }
        });

        fetchUserData();
    </script>
</body>
</html>
