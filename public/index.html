<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yohans Bingo</title>
    <style>
        body {
            background-color: #121629;
            color: white;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .header {
            width: 100%;
            max-width: 400px;
            display: flex;
            justify-content: space-between;
            background: #1b223d;
            padding: 10px 15px;
            border-radius: 8px;
            margin-bottom: 10px;
            font-size: 14px;
        }
        .current-number-box {
            background: #ffb703;
            color: #000;
            width: 90px;
            height: 90px;
            border-radius: 50%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            font-weight: bold;
            margin: 15px auto;
            box-shadow: 0 0 15px rgba(255, 183, 3, 0.5);
        }
        .status-banner {
            background: #2b3556;
            padding: 10px;
            border-radius: 8px;
            text-align: center;
            width: 100%;
            max-width: 400px;
            margin-bottom: 15px;
            font-size: 15px;
        }
        .bingo-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 5px;
            width: 100%;
            max-width: 400px;
        }
        .bingo-cell {
            background: #1e293b;
            aspect-ratio: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            color: #94a3b8;
        }
        .bingo-cell.marked {
            background: #f97316;
            color: white;
        }
        .bingo-cell.header-cell {
            background: #3b82f6;
            color: white;
            font-size: 18px;
        }
        .footer-buttons {
            display: flex;
            justify-content: space-between;
            width: 100%;
            max-width: 400px;
            margin-top: 15px;
        }
        button {
            background: #ef4444;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
        }
        button.bingo-btn {
            background: #10b981;
            flex-grow: 1;
            margin-left: 10px;
        }
    </style>
</head>
<body>

    <div class="header">
        <div>Yohans ID: <br><b>YOHANS-01</b></div>
        <div>Players: <br><b id="playerCount">0</b></div>
        <div>Bet: <br><b>10</b></div>
    </div>

    <div class="status-banner" id="banner">
        ⏳ የዮሐንስ ቢንጎ ጨዋታ ለመጀመር በመጠባበቅ ላይ...
    </div>

    <div class="current-number-box" id="currentNumBox">
        --
    </div>

    <!-- የቢንጎ ሰሌዳ (B-I-N-G-O Grid) -->
    <div class="bingo-grid" id="bingoBoard">
        <div class="bingo-cell header-cell">B</div>
        <div class="bingo-cell header-cell">I</div>
        <div class="bingo-cell header-cell">N</div>
        <div class="bingo-cell header-cell">G</div>
        <div class="bingo-cell header-cell">O</div>
    </div>

    <div class="footer-buttons">
        <button onclick="leaveGame()">Leave</button>
        <button class="bingo-btn" onclick="claimBingo()">BINGO!</button>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        const banner = document.getElementById('banner');
        const currentNumBox = document.getElementById('currentNumBox');
        const playerCountElem = document.getElementById('playerCount');
        const bingoBoard = document.getElementById('bingoBoard');

        let calledNumsList = [];

        // 1 እስከ 75 ያሉትን ቁጥሮች በሰሌዳው ላይ መሙላት
        function createBoard() {
            for (let i = 1; i <= 75; i++) {
                const cell = document.createElement('div');
                cell.className = 'bingo-cell';
                cell.id = `cell-${i}`;
                cell.innerText = i;
                bingoBoard.appendChild(cell);
            }
        }
        createBoard();

        socket.on('playerCount', (count) => {
            playerCountElem.innerText = count;
        });

        socket.on('gameState', (data) => {
            if (data.gameState === 'WAITING') {
                banner.innerText = `⏳ ጨዋታው ለመጀመር ${data.countdown} ሰከንድ ቀርቷል...`;
                currentNumBox.innerText = "--";
                resetBoardColors();
            } else if (data.gameState === 'PLAYING') {
                banner.innerText = `🎮 የዮሐንስ ቢንጎ በሂደት ላይ ነው!`;
            }
        });

        socket.on('numberCalled', (data) => {
            currentNumBox.innerText = data.number;
            calledNumsList = data.calledNumbers;
            
            document.querySelectorAll('.bingo-cell').forEach(cell => {
                const val = parseInt(cell.innerText);
                if (calledNumsList.includes(val)) {
                    cell.classList.add('marked');
                }
            });
        });

        socket.on('gameOver', (data) => {
            banner.innerHTML = `🏆 <b>BINGO! WON!</b> አሸናፊ: ${data.winner}`;
        });

        function resetBoardColors() {
            document.querySelectorAll('.bingo-cell').forEach(cell => {
                if (!cell.classList.contains('header-cell')) {
                    cell.classList.remove('marked');
                }
            });
        }

        function claimBingo() {
            socket.emit('bingoClaim', {
                username: "ዮሐንስ ተጫዋች",
                cartelaId: 64,
                winningNumbers: calledNumsList
            });
        }

        function leaveGame() {
            alert('ጨዋታውን ለቀው ወጥተዋል!');
        }
    </script>
</body>
</html>
