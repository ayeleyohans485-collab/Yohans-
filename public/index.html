<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Beteseb Bingo - Yohans</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #0f172a; color: white; margin: 0; padding: 10px; text-align: center; }
        .header { display: flex; justify-content: space-between; background: #1e293b; padding: 10px; border-radius: 8px; font-size: 14px; margin-bottom: 10px; }
        .board { display: grid; grid-template-columns: repeat(5, 1fr); gap: 5px; max-width: 400px; margin: 0 auto; }
        .cell { padding: 10px 0; background-color: #1e293b; border: 1px solid #334155; font-size: 16px; font-weight: bold; border-radius: 4px; }
        .called { background-color: #f97316 !important; color: white; border-color: #ea580c; }
        .footer-btn { margin-top: 15px; width: 100%; max-width: 400px; padding: 12px; background-color: #22c55e; color: white; border: none; font-size: 18px; font-weight: bold; border-radius: 8px; cursor: pointer; }
        #winModal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); justify-content: center; align-items: center; flex-direction: column; }
    </style>
</head>
<body>

    <div class="header">
        <div>Game ID: <span id="gameId">BBK855044</span></div>
        <div>Players: <span id="playersCount">48</span></div>
        <div>Called: <span id="calledCount">0</span></div>
    </div>

    <h3>Yohans Beteseb Bingo</h3>
    <div id="statusText" style="color: #38bdf8; margin-bottom: 10px;">ጨዋታው ሊጀመር 45 ሰከንድ ይቀረዋል...</div>

    <!-- 75 ሰሌዳ -->
    <div id="board" class="board"></div>

    <button class="footer-btn" style="background-color: #ef4444;" onclick="leaveGame()">Leave</button>
    <button class="footer-btn" onclick="claimBingo()">BINGO!</button>

    <!-- አሸናፊ ሲወጣ የሚመጣ ፕۆፕአፕ -->
    <div id="winModal">
        <h1 style="color: #facc15;">🏆 BINGO! 🏆</h1>
        <p id="winnerMsg" style="font-size: 20px;"></p>
        <p>Auto-starting next game...</p>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        const board = document.getElementById('board');
        const cells = {};

        // ሰሌዳውን መገንባት
        for(let i = 1; i <= 75; i++) {
            const cell = document.createElement('div');
            cell.className = 'cell';
            cell.innerText = i;
            board.appendChild(cell);
            cells[i] = cell;
        }

        socket.on('gameState', (data) => {
            document.getElementById('gameId').innerText = data.gameId;
            document.getElementById('playersCount').innerText = data.playersCount;
            document.getElementById('calledCount').innerText = data.calledNumbers.length;
            
            if (data.gameState === 'WAITING') {
                document.getElementById('statusText').innerText = `ቀጣይ ጨዋታ ሊጀመር ${data.countdown} ሰከንድ ይቀረዋል...`;
            } else if (data.gameState === 'PLAYING') {
                document.getElementById('statusText').innerText = `ጨዋታ በመካሄድ ላይ ነው! አሁን የወጣው: ${data.currentNumber || '-'}`;
            }

            // የወጡ ቁጥሮችን ማሳየት
            Object.values(cells).forEach(c => c.classList.remove('called'));
            data.calledNumbers.forEach(num => {
                if(cells[num]) cells[num].classList.add('called');
            });
        });

        socket.on('numberCalled', (data) => {
            document.getElementById('calledCount').innerText = data.calledNumbers.length;
            document.getElementById('statusText').innerText = `አሁን የወጣው ቁጥር: ${data.number}`;
            if(cells[data.number]) {
                cells[data.number].classList.add('called');
            }
        });

        socket.on('gameOver', (data) => {
            const modal = document.getElementById('winModal');
            document.getElementById('winnerMsg').innerText = `${data.winner} አሸንፏል! (ካርቴላ: ${data.cartelaId})`;
            modal.style.display = 'flex';
        });

        socket.on('gameStarted', () => {
            document.getElementById('winModal').style.display = 'none';
            Object.values(cells).forEach(c => c.classList.remove('called'));
        });

        function claimBingo() {
            socket.emit('bingoClaim', { username: 'ዮሐንስ', cartelaId: 64 });
        }

        function leaveGame() {
            window.location.reload();
        }
    </script>
</body>
</html>
