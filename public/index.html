<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yohans Bingo Mini App</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #1c242d;
            color: #ffffff;
            text-align: center;
            padding: 20px;
            margin: 0;
        }
        .container {
            max-width: 400px;
            margin: auto;
            background: #242f3d;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        h1 {
            color: #0088cc;
            font-size: 24px;
        }
        .btn {
            background-color: #0088cc;
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 15px;
            width: 100%;
        }
        .btn:hover {
            background-color: #006699;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎮 Yohans Bingo Mini App</h1>
        <p>እንኳን ወደ Yohans Bingo ጨዋታ በደህና መጡ!</p>
        <button class="btn" onclick="buyCard()">የቢንጎ ካርድ ግዛ (2 ETB)</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        function buyCard() {
            const userId = tg.initDataUnsafe?.user?.id;
            if (!userId) {
                alert("ተጠቃሚው አልተገኘም! እባክዎን ቦቱን በቴሌግራም ይክፈቱ።");
                return;
            }

            fetch('/api/buy-card', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ userId: userId, price: 2.00 })
            })
            .then(res => res.json())
            .then(data => {
                if (data.success) {
                    alert("ካርድ በስኬት ገዝተዋል! ቀሪ ሂሳብዎ: " + data.newBalance + " ETB");
                } else {
                    alert("ስህተት: " + data.message);
                }
            })
            .catch(err => alert("የሰርቨር ስህተት ተከሰቷል!"));
        }
    </script>
</body>
</html>
