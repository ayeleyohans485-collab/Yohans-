<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yohans Bingo Mini App</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #151d2a;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        .container {
            background-color: #1e293b;
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            text-align: center;
            width: 100%;
            max-width: 400px;
        }
        h1 {
            font-size: 22px;
            color: #38bdf8;
            margin-bottom: 8px;
        }
        p {
            color: #94a3b8;
            font-size: 14px;
            margin-bottom: 24px;
        }
        .buy-btn {
            background: linear-gradient(135deg, #0284c7, #0369a1);
            color: white;
            border: none;
            padding: 14px 20px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            width: 100%;
            transition: background 0.3s ease;
        }
        .buy-btn:active {
            transform: scale(0.98);
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>🎮 Yohans Bingo Mini App</h1>
        <p>እንኳን ወደ Yohans Bingo ጨዋታ በደህና መጡ!</p>
        
        <button class="buy-btn" onclick="buyCard()">የቢንጎ ካርድ ግዛ (10 ETB)</button>
    </div>

    <script>
        const tg = window.Telegram?.WebApp;
        if (tg) {
            tg.ready();
            tg.expand();
        }

        async function buyCard() {
            const userId = tg?.initDataUnsafe?.user?.id;

            if (!userId) {
                alert("የቴሌግራም መለያዎን ማግኘት አልተቻለም! እባክዎን ቦቱን በ Telegram ክፈቱት።");
                return;
            }

            try {
                const response = await fetch('/api/buy-card', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ userId: userId, price: 10 })
                });

                const result = await response.json();

                if (result.success) {
                    alert(`🎉 ካርድ በተሳካ ሁኔታ ገዝተዋል!\n💰 ቀሪ ሂሳብዎ: ${result.newBalance.toFixed(2)} ETB`);
                } else {
                    alert("⚠️ ስህተት: " + result.message);
                }
            } catch (error) {
                alert("❌ ከሰርቨር ጋር መገናኘት አልተቻለም!");
            }
        }
    </script>

</body>
</html>
