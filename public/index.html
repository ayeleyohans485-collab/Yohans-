<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yohans Bingo V2</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: #121026; color: #ffffff; padding: 15px; }
        
        .home-screen { text-align: center; margin-top: 40px; }
        .stake-title { font-size: 18px; margin-bottom: 20px; color: #cbd5e1; }
        .btn-stake { width: 100%; padding: 16px; margin: 10px 0; border: none; border-radius: 25px; font-size: 18px; font-weight: bold; color: white; background: linear-gradient(90deg, #6366f1, #a855f7); cursor: pointer; }
        
        .game-screen { display: none; }
        .top-bar { display: flex; justify-content: space-between; align-items: center; background: #1e1b4b; padding: 12px; border-radius: 10px; margin-bottom: 12px; font-size: 14px; font-weight: 500; }
        .timer { color: #facc15; font-weight: bold; }
        
        .toast { display: none; background: #ef4444; color: white; padding: 10px; border-radius: 8px; font-size: 14px; margin-bottom: 12px; text-align: center; font-weight: bold; }
        .info-msg { background: #334155; color: #38bdf8; padding: 10px; border-radius: 8px; font-size: 13px; margin-bottom: 12px; text-align: center; }

        .grid-container { display: grid; grid-template-columns: repeat(8, 1fr); gap: 6px; max-height: 55vh; overflow-y: auto; background: #1e1b4b; padding: 10px; border-radius: 10px; }
        .card-num { background: #312e81; text-align: center; padding: 12px 2px; border-radius: 6px; font-size: 13px; font-weight: bold; cursor: pointer; user-select: none; }
        .card-num.selected { background: #f97316; color: white; }

        .nav-back { background: #4c1d95; color: white; border: none; padding: 8px 16px; border-radius: 6px; margin-bottom: 12px; cursor: pointer; font-weight: bold; }
        
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); justify-content: center; align-items: center; }
        .modal-content { background: #1e1b4b; padding: 25px; border-radius: 15px; text-align: center; width: 85%; max-width: 320px; border: 1px solid #a855f7; }
        .modal-btn { background: #a855f7; color: white; border: none; padding: 10px 20px; border-radius: 8px; margin-top: 15px; cursor: pointer; font-weight: bold; width: 100%; }
    </style>
</head>
<body>

    <!-- Home View -->
    <div id="homeView" class="home-screen">
        <h2 style="margin-bottom: 10px;">Welcome to <span style="color: #a855f7;">Yohans Bingo</span></h2>
        <div class="stake-title">Choose Your Stake</div>
        <button class="btn-stake" onclick="startGame(10)">Play 10 ETB</button>
        <button class="btn-stake" onclick="startGame(20)">Play 20 ETB</button>
    </div>

    <!-- Game View -->
    <div id="gameView" class="game-screen">
        <button class="nav-back" onclick="showHome()">← Back</button>
        
        <div id="toast" class="toast">⚠️ Insufficient wallet balance.</div>
        <div class="info-msg" id="infoMsg">እባክዎ 5 ቁጥሮችን ይምረጡ (የተመረጡ: 0/5)</div>

        <div class="top-bar">
            <div>Main Wallet: <span id="walletBal">0</span> ETB</div>
            <div>Stake: <span id="currentStake">10</span></div>
            <div class="timer"><span id="timerSec">30</span> s</div>
        </div>

        <div class="grid-container" id="grid"></div>
    </div>

    <!-- Result Modal -->
    <div id="resultModal" class="modal">
        <div class="modal-content">
            <h3 id="modalTitle" style="margin-bottom: 10px;">የጨዋታ ውጤት</h3>
            <p id="modalBody" style="font-size: 14px; line-height: 1.5;"></p>
            <button class="modal-btn" onclick="closeModal()">እሺ</button>
        </div>
    </div>

    <script>
        const tg = window.Telegram?.WebApp;
        if(tg) { tg.ready(); tg.expand(); }

        let userId = tg?.initDataUnsafe?.user?.id || 123456789;
        let currentStake = 10;
        let balance = 0;
        let timerInterval;
        let selectedNumbers = [];

        async function fetchUserData() {
            try {
                let res = await fetch(`/api/user-data/${userId}`);
                let data = await res.json();
                balance = data.balance;
                document.getElementById('walletBal').innerText = balance.toFixed(0);
            } catch(e) {}
        }
        fetchUserData();

        function startGame(stake) {
            currentStake = stake;
            selectedNumbers = [];
            document.getElementById('currentStake').innerText = stake;
            document.getElementById('homeView').style.display = 'none';
            document.getElementById('gameView').style.display = 'block';
            updateInfoMsg();
            buildGrid();
            startTimer();
        }

        function showHome() {
            clearInterval(timerInterval);
            document.getElementById('homeView').style.display = 'block';
            document.getElementById('gameView').style.display = 'none';
        }

        function buildGrid() {
            const grid = document.getElementById('grid');
            grid.innerHTML = '';
            for(let i = 1; i <= 75; i++) {
                let btn = document.createElement('div');
                btn.className = 'card-num';
                btn.innerText = i;
                btn.onclick = () => selectCard(i, btn);
                grid.appendChild(btn);
            }
        }

        function updateInfoMsg() {
            document.getElementById('infoMsg').innerText = `እባክዎ 5 ቁጥሮችን ይምረጡ (የተመረጡ: ${selectedNumbers.length}/5)`;
        }

        async function selectCard(num, element) {
            let toast = document.getElementById('toast');
            toast.style.display = 'none';

            if (selectedNumbers.includes(num)) {
                selectedNumbers = selectedNumbers.filter(n => n !== num);
                element.classList.remove('selected');
            } else {
                if (selectedNumbers.length >= 5) {
                    toast.innerText = "⚠️ ከ 5 በላይ ቁጥር መምረጥ አይችሉም!";
                    toast.style.display = 'block';
                    setTimeout(() => { toast.style.display = 'none'; }, 2500);
                    return;
                }
                selectedNumbers.push(num);
                element.classList.add('selected');
            }

            updateInfoMsg();

            if (selectedNumbers.length === 5) {
                playGame();
            }
        }

        async function playGame() {
            try {
                let res = await fetch('/api/play-card', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ userId: userId, stake: currentStake, cardNumber: selectedNumbers.join(",") })
                });

                let data = await res.json();

                if(!data.success) {
                    let toast = document.getElementById('toast');
                    toast.innerText = "⚠️ " + data.message;
                    toast.style.display = 'block';
                    setTimeout(() => { toast.style.display = 'none'; }, 3000);
                } else {
                    balance = data.newBalance;
                    document.getElementById('walletBal').innerText = balance.toFixed(0);

                    let winningNumbers = [];
                    while(winningNumbers.length < 5) {
                        let r = Math.floor(Math.random() * 75) + 1;
                        if(!winningNumbers.includes(r)) winningNumbers.push(r);
                    }

                    let matches = selectedNumbers.filter(n => winningNumbers.includes(n));

                    let resultText = `የእርስዎ ቁጥሮች: ${selectedNumbers.join(', ')}<br>`;
                    resultText += `የወጡት ቁጥሮች: ${winningNumbers.join(', ')}<br><br>`;

                    if (matches.length >= 3) {
                        resultText += `🎉 **እንኳን ደስ አለዎት!** ${matches.length} ቁጥር አግኝተዋል!`;
                    } else {
                        resultText += `❌ **ለጥቂት ነው ያመለጣችሁ!** ${matches.length} ቁጥር ብቻ ነው የገጠመው።`;
                    }

                    showModal("የጨዋታው ውጤት", resultText);
                }
            } catch(e) {
                alert("የኔትወርክ ስህተት ተከሰቷል!");
            }
        }

        function showModal(title, text) {
            document.getElementById('modalTitle').innerText = title;
            document.getElementById('modalBody').innerHTML = text;
            document.getElementById('resultModal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('resultModal').style.display = 'none';
            selectedNumbers = [];
            buildGrid();
            updateInfoMsg();
        }

        function startTimer() {
            let sec = 30;
            document.getElementById('timerSec').innerText = sec;
            clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                sec--;
                document.getElementById('timerSec').innerText = sec;
                if(sec <= 0) sec = 30;
            }, 1000);
        }
    </script>
</body>
</html>
