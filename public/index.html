<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yohans Beteseb Bingo</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #0f172a;
            color: #ffffff;
            margin: 0;
            padding: 20px;
            text-align: center;
        }
        .container {
            max-width: 400px;
            margin: auto;
            background: #1e293b;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        h2 { color: #38bdf8; }
        .info {
            display: flex;
            justify-content: space-between;
            background: #334155;
            padding: 10px 15px;
            border-radius: 8px;
            margin: 15px 0;
            font-size: 14px;
        }
        .btn-danger {
            background-color: #ef4444;
            color: white;
            border: none;
            width: 100%;
            padding: 12px;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 10px;
        }
        .btn-success {
            background-color: #22c55e;
            color: white;
            border: none;
            width: 100%;
            padding: 12px;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Yohans Beteseb Bingo</h2>
        <p>እንኳን ደህና መጡ! ጨዋታው በቅርቡ ይጀምራል...</p>
        
        <div class="info">
            <span id="game-id">Game ID: BBK855044</span>
            <span id="players-count">Players: 1</span>
        </div>

        <button class="btn-danger" onclick="leaveGame()">Leave</button>
        <button class="btn-success" onclick="claimBingo()">BINGO!</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        function leaveGame() {
            tg.close();
        }

        function claimBingo() {
            alert("ቢንጎ ታውጇል! ተረጋግጦ ይሸለማሉ!");
        }
    </script>
</body>
</html>
